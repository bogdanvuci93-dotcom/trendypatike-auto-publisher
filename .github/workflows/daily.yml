name: TrendyPatike Daily Carousel

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish this generated carousel to Instagram?"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "35 19 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: trendypatike-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: |
          node --version
          npm --version
          fc-match "DejaVu Sans Condensed" || true
          npm install --omit=dev --no-audit --no-fund

      - name: Zero-cost code and render preflight
        run: npm run check

      - name: Generate, verify and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          TEXT_MODEL: "gpt-5-mini-2025-08-07"
          VERIFY_MODEL: "gpt-5-mini-2025-08-07"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          BRAND_GREEN: "#037361"
          BRAND_NAME: "TRENDYPATIKE"
          BRAND_SITE: "trendypatike.com"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.publish_now && 'false' || 'true') }}
          FORCE_RUN: "false"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "8"
        run: npm run run
