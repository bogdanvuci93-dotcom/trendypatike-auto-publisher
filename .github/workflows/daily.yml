name: TrendyPatike Daily Carousel

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish this generated carousel to Instagram?"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "35 19 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write
  actions: read

concurrency:
  group: trendypatike-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: |
          node --version
          npm --version
          fc-match "DejaVu Sans Condensed" || true
          npm install --omit=dev --no-audit --no-fund

      - name: Restore paid-work recovery bundle
        if: ${{ github.event_name == 'schedule' || inputs.publish_now }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -rf /tmp/trendypatike-recovery /tmp/trendypatike-recovery.zip
          RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=trendypatike-recovery&per_page=100")"
          ARTIFACT_ID="$(printf '%s' "$RESPONSE" | jq -r '[.artifacts[] | select(.expired == false)] | max_by(.created_at).id // empty')"
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p /tmp/trendypatike-recovery
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/trendypatike-recovery.zip
            unzip -oq /tmp/trendypatike-recovery.zip -d /tmp/trendypatike-recovery
            node src/recovery.mjs restore /tmp/trendypatike-recovery
          else
            echo "No previous recovery artifact found."
          fi
          exit 0

      - name: Apply live visual and reliability policy
        run: |
          # Merge the fresh emergency reserve into the live fallback library.
          # The source files stay unchanged in git; only the checked-out runner copy is merged.
          if [ -f data/fallback-posts-extra.json ]; then
            jq -s 'add' data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
            mv /tmp/fallback-posts.json data/fallback-posts.json
          fi

          # Emergency/fallback TEXT stays available as a safety net, but live
          # publishing must still try distinct AI visuals first.
          # Zero-cost dry runs keep local visuals by design.
          sed -i 's/post\.force_local_images = true;/post.force_local_images = cfg.dryRun;/' src/index.mjs

          # Salt the post fingerprint with the current render generation so an
          # old final JPG can never bypass a newer layout.
          sed -i 's/\.update(JSON\.stringify(post))/\.update("editorial-v2:" + JSON.stringify(post))/' src/index.mjs

          # The verifier performs web research and can legitimately need more
          # than three minutes. Do not abort a healthy paid response at 180s.
          sed -i 's/AbortSignal\.timeout(180000)/AbortSignal.timeout(360000)/g' src/openai.mjs

          echo "Fallback entries: $(jq length data/fallback-posts.json)"
          grep -n "post.force_local_images\|editorial-v2\|AbortSignal.timeout(360000)" src/index.mjs src/openai.mjs

      - name: Zero-cost code and render preflight
        env:
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
        run: npm run check

      - name: Generate, verify and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          BRAND_GREEN: "#037361"
          BRAND_NAME: "TRENDYPATIKE"
          BRAND_SITE: "trendypatike.com"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.publish_now && 'false' || 'true') }}
          FORCE_RUN: "false"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "8"
        run: npm run run

      - name: Build paid-work recovery bundle
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish_now) }}
        continue-on-error: true
        run: node src/recovery.mjs save .recovery

      - name: Preserve paid-work recovery bundle
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish_now) }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trendypatike-recovery
          path: .recovery/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
          overwrite: true
