name: TrendyPatike Daily Carousel

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish this generated carousel to Instagram?"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "7 18 * * *"
      timezone: "Europe/Belgrade"
    - cron: "37 18 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write
  actions: read

concurrency:
  group: trendypatike-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: |
          node --version
          npm --version
          fc-match "DejaVu Sans Condensed" || true
          npm install --omit=dev --no-audit --no-fund

      - name: Restore paid-work recovery bundle
        if: ${{ github.event_name == 'schedule' || inputs.publish_now }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -rf /tmp/trendypatike-recovery /tmp/trendypatike-recovery.zip
          RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=trendypatike-recovery&per_page=100")"
          ARTIFACT_ID="$(printf '%s' "$RESPONSE" | jq -r '[.artifacts[] | select(.expired == false)] | max_by(.created_at).id // empty')"
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p /tmp/trendypatike-recovery
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/trendypatike-recovery.zip
            unzip -oq /tmp/trendypatike-recovery.zip -d /tmp/trendypatike-recovery
            node src/recovery.mjs restore /tmp/trendypatike-recovery
          else
            echo "No previous recovery artifact found."
          fi
          exit 0

      - name: Apply live visual and reliability policy
        run: |
          set -euo pipefail

          jq empty data/fallback-posts.json
          if [ -f data/fallback-posts-extra.json ]; then
            jq empty data/fallback-posts-extra.json
            jq -s 'add | map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
          else
            jq 'map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json > /tmp/fallback-posts.json
          fi
          mv /tmp/fallback-posts.json data/fallback-posts.json
          jq empty data/fallback-posts.json

          python scripts/harden_content_policy.py
          python scripts/fix_copy_overflow.py
          python scripts/format_semantic_accents.py
          python scripts/scroll_stop_policy.py

          sed -i 's/post\.force_local_images = true;/post.force_local_images = cfg.dryRun;/' src/index.mjs
          sed -i 's/\.update(JSON\.stringify(post))/\.update("fullbleed-v13-scroll-stop:" + JSON.stringify(post))/' src/index.mjs
          sed -i 's/AbortSignal\.timeout(180000)/AbortSignal.timeout(360000)/g' src/openai.mjs

          echo "Fallback entries: $(jq length data/fallback-posts.json)"
          grep -n "post.force_local_images\|fullbleed-v13-scroll-stop\|AbortSignal.timeout(360000)" src/index.mjs src/openai.mjs
          grep -n "hardenImagePrompts\|simplifyKidPhrase\|capHeadlineWords\|normalizeMoneyNotation\|semanticAccentSegments\|SCROLL-STOP VISUAL" src/content.mjs

      - name: Zero-cost code and render preflight
        env:
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
        run: npm run check

      - name: Generate, verify and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          BRAND_GREEN: "#037361"
          BRAND_NAME: "TRENDYPATIKE"
          BRAND_SITE: "trendypatike.com"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.publish_now && 'false' || 'true') }}
          FORCE_RUN: "false"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "8"
        run: npm run run

      - name: Build paid-work recovery bundle
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish_now) }}
        continue-on-error: true
        run: node src/recovery.mjs save .recovery

      - name: Preserve paid-work recovery bundle
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish_now) }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trendypatike-recovery
          path: .recovery/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
          overwrite: true
