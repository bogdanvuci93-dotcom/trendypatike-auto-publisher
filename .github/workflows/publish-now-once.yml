name: TrendyPatike Publish Now Once

on:
  push:
    branches:
      - main
    paths:
      - "data/manual-publish-now-once.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch live daily workflow now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --repo "${GITHUB_REPOSITORY}" --ref main -f publish_now=true
