name: Growth dashboard check

on:
  push:
    branches: [growth-dashboard-mvp]
    paths:
      - 'growth/**'
      - '.github/workflows/growth-check.yml'
  pull_request:
    paths:
      - 'growth/**'
      - '.github/workflows/growth-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm run build
