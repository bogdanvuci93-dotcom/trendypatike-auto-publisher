name: TrendyPatike Zero-Cost Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "data/topics.json"
      - "data/fallback-posts.json"
      - "data/fallback-posts-extra.json"
      - "data/state.json"
      - "data/pending-post.json"
      - "data/openai-cache.json"
      - "package.json"
      - ".github/workflows/daily.yml"
      - ".github/workflows/preflight.yml"

permissions:
  contents: read

concurrency:
  group: trendypatike-code-preflight
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Mirror live fallback library
        run: |
          set -euo pipefail
          if [ -f data/fallback-posts-extra.json ]; then
            jq -s 'add' data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
            mv /tmp/fallback-posts.json data/fallback-posts.json
          fi
          echo "Preflight fallback entries: $(jq length data/fallback-posts.json)"

      - name: Offline publisher self-test
        env:
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "8"
        run: npm run check
