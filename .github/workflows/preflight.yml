name: TrendyPatike Zero-Cost Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "data/topics.json"
      - "data/fallback-posts.json"
      - "data/fallback-posts-extra.json"
      - "data/fallback-posts-attention.json"
      - "data/fallback-posts-safe.json"
      - "data/state.json"
      - "data/pending-post.json"
      - "data/openai-cache.json"
      - "package.json"
      - ".github/workflows/daily.yml"
      - ".github/workflows/publish-two-now.yml"
      - ".github/workflows/publish-one-retry-now.yml"
      - ".github/workflows/preflight.yml"

permissions:
  contents: read

concurrency:
  group: trendypatike-code-preflight
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Mirror live policy without paid API calls
        run: |
          set -euo pipefail
          jq empty data/fallback-posts.json
          jq empty data/fallback-posts-extra.json
          jq empty data/fallback-posts-attention.json
          jq empty data/fallback-posts-safe.json
          jq -s 'add | map(.post.slide_count = (.post.slide_count // 3))' \
            data/fallback-posts-safe.json data/fallback-posts-attention.json data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
          mv /tmp/fallback-posts.json data/fallback-posts.json

          python scripts/harden_content_policy.py
          python scripts/fix_copy_overflow.py
          python scripts/format_semantic_accents.py
          python scripts/scroll_stop_policy.py
          python scripts/retry_content_policy.py
          python scripts/detail_copy_policy.py
          python scripts/attention_story_policy.py
          python scripts/background_responses_policy.py
          python scripts/require_real_images.py
          python scripts/economy_text_policy.py

          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.mjs')
          s = p.read_text(encoding='utf-8')
          needle = 'async function buildNewPost({ topics, state, aiTextAvailable }) {\n  if (cfg.dryRun) {'
          repl = 'async function buildNewPost({ topics, state, aiTextAvailable }) {\n  if (process.env.FORCE_VERIFIED_FALLBACK === "true") {\n    console.log("[fallback] Forced verified fallback: skipping paid text research and verifier.");\n    return loadEmergencyFallback(state);\n  }\n  if (cfg.dryRun) {'
          if needle not in s:
              raise SystemExit('force verified fallback patch anchor not found')
          p.write_text(s.replace(needle, repl, 1), encoding='utf-8')
          PY

          grep -n "allowMajorNews = false" src/index.mjs
          grep -n "maxOutputTokens = 6000\|structuredAttempt <= 1" src/openai.mjs
          grep -n "refusing placeholder publish\|kids-editorial-v13-real-image-long-copy" src/render.mjs
          echo "Recovery fallback entries: $(jq length data/fallback-posts.json)"

      - name: Offline publisher and render self-test
        env:
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "4"
          FORCE_VERIFIED_FALLBACK: "true"
        run: npm run check
