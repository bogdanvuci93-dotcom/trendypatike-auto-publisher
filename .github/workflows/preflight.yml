name: TrendyPatike Zero-Cost Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "data/topics.json"
      - "data/fallback-posts.json"
      - "data/fallback-posts-extra.json"
      - "data/state.json"
      - "data/pending-post.json"
      - "data/openai-cache.json"
      - "package.json"
      - ".github/workflows/daily.yml"
      - ".github/workflows/publish-two-now.yml"
      - ".github/workflows/publish-one-retry-now.yml"
      - ".github/workflows/preflight.yml"

permissions:
  contents: read

concurrency:
  group: trendypatike-code-preflight
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Mirror complete live policy without paid API calls
        run: |
          set -euo pipefail
          jq empty data/fallback-posts.json
          if [ -f data/fallback-posts-extra.json ]; then
            jq empty data/fallback-posts-extra.json
            jq -s 'add | map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
          else
            jq 'map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json > /tmp/fallback-posts.json
          fi
          mv /tmp/fallback-posts.json data/fallback-posts.json
          jq empty data/fallback-posts.json

          python scripts/harden_content_policy.py
          python scripts/fix_copy_overflow.py
          python scripts/format_semantic_accents.py
          python scripts/scroll_stop_policy.py
          python scripts/retry_content_policy.py
          python scripts/detail_copy_policy.py
          python scripts/attention_story_policy.py
          python scripts/background_responses_policy.py

          grep -n "ATTENTION-FIRST STORY\|hardenImagePrompts\|simplifyKidPhrase\|capHeadlineWords" src/content.mjs
          grep -n "pollBackgroundResponse\|background: true\|45[0-9][0-9][0-9]" src/openai.mjs
          echo "Preflight fallback entries: $(jq length data/fallback-posts.json)"

      - name: Offline publisher and render self-test
        env:
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          MAX_TOPIC_ATTEMPTS: "1"
          MAX_OPENAI_CALLS: "8"
        run: npm run check
