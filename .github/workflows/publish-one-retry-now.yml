name: TrendyPatike Publish One Retry Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-one-retry-now.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: trendypatike-publish-one-retry-now
  cancel-in-progress: false

jobs:
  publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Apply Serbia-aware content and reliability policy
        run: |
          set -euo pipefail
          jq empty data/fallback-posts.json
          if [ -f data/fallback-posts-extra.json ]; then
            jq empty data/fallback-posts-extra.json
            jq -s 'add | map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json data/fallback-posts-extra.json > /tmp/fallback-posts.json
          else
            jq 'map(.post.slide_count = (.post.slide_count // 3))' \
              data/fallback-posts.json > /tmp/fallback-posts.json
          fi
          mv /tmp/fallback-posts.json data/fallback-posts.json

          python scripts/harden_content_policy.py
          python scripts/fix_copy_overflow.py
          python scripts/format_semantic_accents.py
          python scripts/scroll_stop_policy.py
          python scripts/retry_content_policy.py

          sed -i 's/post\.force_local_images = true;/post.force_local_images = cfg.dryRun;/' src/index.mjs
          sed -i 's/\.update(JSON\.stringify(post))/\.update("fullbleed-v14-serbia:" + JSON.stringify(post))/' src/index.mjs
          sed -i 's/AbortSignal\.timeout(180000)/AbortSignal.timeout(360000)/g' src/openai.mjs
          npm run check

      - name: Publish second catch-up post with transient retry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          TEXT_MODEL: "gpt-5-mini"
          VERIFY_MODEL: "gpt-5-mini"
          IMAGE_MODEL: "gpt-image-1-mini"
          IMAGE_QUALITY: "medium"
          BRAND_GREEN: "#037361"
          BRAND_NAME: "TRENDYPATIKE"
          BRAND_SITE: "trendypatike.com"
          DRY_RUN: "false"
          FORCE_RUN: "true"
          MAX_TOPIC_ATTEMPTS: "3"
          MAX_OPENAI_CALLS: "8"
          SKIP_MAJOR_NEWS: "true"
          SERBIAN_AUDIENCE_NOW: "true"
        run: |
          set +e
          npm run run
          code=$?
          if [ $code -eq 0 ]; then
            exit 0
          fi

          echo "First publish attempt failed. Re-applying runtime policy and retrying once after 20 seconds..."
          sleep 20
          git fetch origin main
          git reset --hard origin/main

          python scripts/harden_content_policy.py
          python scripts/fix_copy_overflow.py
          python scripts/format_semantic_accents.py
          python scripts/scroll_stop_policy.py
          python scripts/retry_content_policy.py
          sed -i 's/post\.force_local_images = true;/post.force_local_images = cfg.dryRun;/' src/index.mjs
          sed -i 's/\.update(JSON\.stringify(post))/\.update("fullbleed-v14-serbia:" + JSON.stringify(post))/' src/index.mjs
          sed -i 's/AbortSignal\.timeout(180000)/AbortSignal.timeout(360000)/g' src/openai.mjs

          npm run run
